# Tema claro, o mesmo dos painéis de TB e hanseníase (src/theme/).
[theme]
base = "light"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#0B1220"
primaryColor = "#1E73BE"

[server]
headless = true
fileWatcherType = "none"
runOnSave = false
# O endereço público é painel.cenarios.unb.br/cenarios/demografico/.
baseUrlPath = "cenarios/demografico"

[client]
# Sem o botão "Deploy" nem o menu de desenvolvedor na tela pública.
toolbarMode = "minimal"
